<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン | Task &amp; Idea Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" data-page="login">
  <main class="auth-card">
    <h1>Task &amp; Idea Hub</h1>
    <h2>ログイン</h2>
    <p class="auth-lead">ユーザー名とパスワードを入力してください。</p>
    <form id="auth-form" class="auth-form">
      <label>ユーザー名<input name="username" autocomplete="username" required maxlength="50"></label>
      <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>

      <p id="auth-error" class="form-error" role="alert"></p>
      <button type="submit" class="primary">ログイン</button>
    </form>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
