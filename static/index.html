<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="main-page">
  <nav id="app-tabs" class="app-tabs"></nav>
  <div class="app">
    <section class="pane pane-gantt">
      <header class="toolbar">
        <button id="add-task" type="button" class="primary">＋ タスク</button>
        <button id="add-recurring" type="button" class="recurring-btn" title="毎月○日・毎月第○○曜日・毎週○曜日のタスク">＋ 定期タスク</button>
        <button id="add-decision" type="button" class="decision-btn">＋ ディシジョン</button>
        <button id="today-filter" type="button" class="today-filter" aria-pressed="false" title="今日のタスクだけを表示">☀ 今日 <span id="today-count">0</span></button>
        <input id="task-search" class="task-search" type="search" placeholder="検索" aria-label="タスクを検索"
          title="タスク名・領域・関連項目・メモ・リンクで絞り込み">
        <div class="seg" role="group" aria-label="表示単位">
          <button type="button" data-scale="day" class="active">日</button>
          <button type="button" data-scale="week">週</button>
          <button type="button" data-scale="month">月</button>
        </div>
        <button id="prev" type="button" aria-label="前へ">◀</button>
        <button id="today" type="button">今日</button>
        <button id="next" type="button" aria-label="次へ">▶</button>
      </header>
      <div id="gantt" class="gantt"></div>
    </section>

    <!-- リンク・ブレストの左端の細い帯。クリックで右側をたたむ／開く -->
    <button id="side-toggle" type="button" class="side-handle" aria-controls="side-pane" aria-expanded="true"
      title="リンク・ブレストをたたむ"><span class="side-handle-arrow">▶</span><span class="side-handle-label">リンク・ブレスト</span></button>
    <aside id="side-pane" class="pane pane-side">
      <section class="panel quick-links">
        <header class="panel-head">
          <h2>リンク</h2>
          <span class="spacer"></span>
          <button id="link-add" type="button" aria-label="リンクを追加" title="リンクを追加">＋</button>
        </header>
        <form id="link-form" class="link-form" hidden>
          <input name="title" placeholder="タイトル（任意）" aria-label="タイトル" maxlength="100">
          <input name="target" placeholder="https://…　C:\…　\\サーバー\…　smb://…" aria-label="リンク先" required>
          <div class="link-form-actions">
            <span id="link-form-error" class="form-error"></span>
            <span class="spacer"></span>
            <button id="link-cancel" type="button">キャンセル</button>
            <button type="submit" class="primary">保存</button>
          </div>
        </form>
        <ul id="link-list" class="link-list"></ul>
      </section>

      <section class="panel brainstorm">
        <header class="panel-head">
          <h2>ブレスト</h2>
          <span class="spacer"></span>
          <a href="ideas.html" class="settings-link" title="アイディア保管庫を開く">💡 アイディア保管庫</a>
        </header>
        <input id="bs-input" placeholder="思いつきを入力して Enter">
        <ul id="bs-list" class="bs-list"></ul>
      </section>
    </aside>
  </div>

  <dialog id="task-dialog">
    <form id="task-form">
      <h2 id="task-form-title">タスクを追加</h2>
      <label>領域<select name="area" required></select></label>
      <label>関連項目<select name="related"></select></label>
      <p class="form-hint">選択肢は REGISTRATION タブで追加できます</p>
      <label>タスク名<input name="title" required></label>
      <label>開始日<input name="start_at" type="date" required></label>
      <label>期限<input name="due_at" type="date" required></label>
      <label>優先度
        <select name="priority">
          <option value="high">高</option>
          <option value="mid">中</option>
          <option value="low">低</option>
        </select>
      </label>
      <label>メモ<textarea name="memo" rows="4" placeholder="進め方・連絡先・気づきなど"></textarea></label>
      <div class="links-field">
        <span class="field-label">リンク</span>
        <ul id="task-links" class="link-rows"></ul>
        <button id="task-link-add" type="button" class="link-add">＋ リンクを追加</button>
      </div>
      <label class="check"><input name="done" type="checkbox">完了</label>
      <p id="task-form-error" class="form-error"></p>
      <div class="actions">
        <button id="task-delete" type="button" class="danger">削除</button>
        <span class="spacer"></span>
        <button id="task-cancel" type="button">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="recurring-dialog">
    <div id="recurring-list-view" class="recurring-view">
      <h2>定期タスク</h2>
      <p class="form-hint">繰り返しの日を期限にしたタスクを、1 か月先の分まで自動で作ります。</p>
      <ul id="recurring-list" class="recurring-list"></ul>
      <div class="actions">
        <button id="recurring-new" type="button" class="primary">＋ 定期タスクを追加</button>
        <span class="spacer"></span>
        <button id="recurring-close" type="button">閉じる</button>
      </div>
    </div>
    <form id="recurring-form" hidden>
      <h2 id="recurring-form-title">定期タスクを追加</h2>
      <label>領域<select name="area" required></select></label>
      <label>関連項目<select name="related"></select></label>
      <label>タスク名<input name="title" required></label>
      <div class="recurring-rule">
        <label>繰り返し
          <select name="rule">
            <option value="monthly_day">毎月 ○日</option>
            <option value="monthly_weekday">毎月 第○ ○曜日</option>
            <option value="weekly">毎週 ○曜日</option>
          </select>
        </label>
        <label data-for="monthly_day">日<select name="day"></select></label>
        <label data-for="monthly_weekday">第
          <select name="nth">
            <option value="1">第1</option>
            <option value="2">第2</option>
            <option value="3">第3</option>
            <option value="4">第4</option>
            <option value="5">最終</option>
          </select>
        </label>
        <label data-for="monthly_weekday weekly">曜日
          <select name="weekday">
            <option value="0">月曜</option>
            <option value="1">火曜</option>
            <option value="2">水曜</option>
            <option value="3">木曜</option>
            <option value="4">金曜</option>
            <option value="5">土曜</option>
            <option value="6">日曜</option>
          </select>
        </label>
      </div>
      <label>何日前から始めるか（0 なら期限の日だけ）<input name="lead_days" type="number" min="0" max="60" value="0" required></label>
      <label>優先度
        <select name="priority">
          <option value="high">高</option>
          <option value="mid">中</option>
          <option value="low">低</option>
        </select>
      </label>
      <label>メモ<textarea name="memo" rows="3"></textarea></label>
      <label>この日以降の回を作る<input name="start_from" type="date" required></label>
      <p id="recurring-form-error" class="form-error"></p>
      <div class="actions">
        <button id="recurring-delete" type="button" class="danger">削除</button>
        <span class="spacer"></span>
        <button id="recurring-back" type="button">戻る</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="decision-dialog">
    <form id="decision-form">
      <h2 id="decision-form-title">ディシジョンポイントを追加</h2>
      <label>名前<input name="title" required placeholder="例：経営会議"></label>
      <label>日付<input name="date" type="date" required></label>
      <label>時刻（任意）<input name="time" type="time"></label>
      <p id="decision-form-error" class="form-error"></p>
      <div class="actions">
        <button id="decision-delete" type="button" class="danger">削除</button>
        <span class="spacer"></span>
        <button id="decision-cancel" type="button">キャンセル</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast-area" class="toast-area" aria-live="polite"></div>

  <script type="module" src="nav.js"></script>
  <script type="module" src="main.js"></script>
  <script type="module" src="quickLinks.js"></script>
</body>
</html>
