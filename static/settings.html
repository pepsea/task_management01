<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登録 | Task &amp; Idea Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page">
  <nav id="app-tabs" class="app-tabs"></nav>

  <main class="settings">
    <section class="settings-card">
      <h2>領域</h2>
      <form id="area-add" class="add-row">
        <input name="name" placeholder="新しい領域（例：仕事）" aria-label="新しい領域" required>
        <button type="submit" class="primary">追加</button>
      </form>
      <ul id="area-list" class="master-list"></ul>
    </section>

    <section class="settings-card">
      <h2>関連項目</h2>
      <form id="related-add" class="add-row">
        <input name="name" placeholder="新しい関連項目（例：PJ-A）" aria-label="新しい関連項目" required>
        <button type="submit" class="primary">追加</button>
      </form>
      <ul id="related-list" class="master-list"></ul>
    </section>

    <section class="settings-card">
      <h2>タグ（アイディア・メモ共通）</h2>
      <ul id="tag-list" class="tag-list"></ul>
    </section>

    <section class="settings-card">
      <h2>パスワード変更</h2>
      <form id="password-form" class="password-form">
        <label>現在のパスワード<input name="current" type="password" autocomplete="current-password" required></label>
        <label>新しいパスワード（8 文字以上）<input name="new" type="password" autocomplete="new-password" required minlength="8"></label>
        <label>新しいパスワード（確認）<input name="confirm" type="password" autocomplete="new-password" required minlength="8"></label>
        <p id="password-error" class="form-error" role="alert"></p>
        <button type="submit" class="primary">変更する</button>
      </form>
    </section>
  </main>

  <div id="toast-area" class="toast-area" aria-live="polite"></div>
  <script type="module" src="nav.js"></script>
  <script type="module" src="settings.js"></script>
</body>
</html>
