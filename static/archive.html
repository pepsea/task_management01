<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page">
  <nav id="app-tabs" class="app-tabs"></nav>
  <header class="toolbar">
    <div class="seg" role="group" aria-label="アーカイブの種類">
      <button type="button" data-kind="tasks">タスク</button>
      <button type="button" data-kind="ideas">アイディア</button>
      <button type="button" data-kind="notes">メモ</button>
    </div>
    <span id="archive-count" class="range-label"></span>
    <a id="archive-export" class="button" href="/api/tasks/archived.csv" title="アーカイブしたタスクを CSV（Excel で開けます）でダウンロード" hidden>⬇ CSV</a>
    <span class="spacer"></span>
    <input id="archive-search" type="search" placeholder="検索（タイトル・本文）" aria-label="検索">
    <select id="archive-tag-filter" aria-label="タグで絞り込み">
      <option value="">すべてのタグ</option>
    </select>
  </header>

  <main id="archive-list" class="archive-list"></main>

  <div id="toast-area" class="toast-area" aria-live="polite"></div>
  <script type="module" src="nav.js"></script>
  <script type="module" src="archive.js"></script>
</body>
</html>
