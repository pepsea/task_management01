<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOTES | Task &amp; Idea Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="settings-page ideas-page">
  <nav id="app-tabs" class="app-tabs"></nav>

  <main class="ideas-layout notes-layout">
    <section class="settings-card ideas-list-card">
      <div class="notes-list-head">
        <button id="note-add" type="button" class="primary">＋ 新しいメモ</button>
        <div class="seg" role="group" aria-label="並び順">
          <button type="button" data-sort="date" class="active">日付順</button>
          <button type="button" data-sort="manual" title="⋮⋮ をドラッグして並べ替え">手動</button>
        </div>
      </div>
      <div class="idea-filters">
        <input id="note-search" type="search" placeholder="検索（タイトル・本文）">
        <select id="note-tag-filter" aria-label="タグで絞り込み">
          <option value="">すべてのタグ</option>
        </select>
      </div>
      <ul id="note-list" class="idea-list note-list"></ul>
    </section>

    <section class="settings-card ideas-editor-card note-editor-card">
      <p id="note-placeholder" class="empty idea-placeholder">左の一覧からメモを選ぶか、「＋ 新しいメモ」で書き始めてください。</p>
      <div id="note-editor" class="note-editor" hidden>
        <div class="editor-actions">
          <label class="note-date" title="メモの日付（作成時は今日）">📅
            <input id="note-date" type="date" aria-label="メモの日付" required>
          </label>
          <div class="tag-editor">
            <span id="note-tags" class="tag-chips"></span>
            <input id="note-tag-input" list="tag-options" placeholder="＋タグ（Enter）" aria-label="タグを追加">
          </div>
          <span class="spacer"></span>
          <button id="note-copy" type="button" title="Markdown の文章をクリップボードにコピー">📋 コピー</button>
          <button id="note-export" type="button" title="Markdown ファイル（.md）として保存">⬇ エクスポート</button>
          <button id="note-archive" type="button" title="メモ帳から外してアーカイブに移す">アーカイブ</button>
          <button id="note-delete" type="button" class="danger">削除</button>
          <button id="note-close" type="button" title="閉じる" aria-label="閉じる">×</button>
        </div>
        <input id="note-title" class="note-title" placeholder="無題" aria-label="タイトル" maxlength="100">
        <div id="note-body" class="md-editor"></div>
        <div class="idea-meta">
          <span id="note-stamp" class="stamp"></span>
          <span class="spacer"></span>
          <span id="note-status" class="status"></span>
        </div>
      </div>
    </section>
  </main>

  <datalist id="tag-options"></datalist>
  <div id="toast-area" class="toast-area" aria-live="polite"></div>
  <script type="module" src="nav.js"></script>
  <script type="module" src="notes.js"></script>
</body>
</html>
