services:
  app:
    build: .
    image: task-idea-hub
    container_name: task-idea-hub
    ports:
      # このパソコンからだけ開けるようにする（社内の他の PC からも使うなら "5003:5003" に変える）
      - "127.0.0.1:5003:5003"
    volumes:
      # データ（SQLite）はホストの ./data/app.db に保存する。コンテナを作り直しても消えない
      - ./data:/app/data
    restart: unless-stopped
