services:
  app:
    build: .
    image: task-idea-hub
    container_name: task-idea-hub
    ports:
      # 社内の他の PC からも開けるようにする（ログインが必要）。
      # このパソコンからだけに限るなら "127.0.0.1:5003:5003" に変える
      - "5003:5003"
    volumes:
      # データ（SQLite）はホストの ./data/app.db に保存する。コンテナを作り直しても消えない
      - ./data:/app/data
    restart: unless-stopped
